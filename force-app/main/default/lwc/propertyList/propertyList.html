<template>
  <lightning-card title="Properties" icon-name="standard:household">
    <div class="slds-p-around_medium">
      <lightning-input type="search" label="Search properties" value={searchKey} onchange={handleSearch}></lightning-input>
      <template if:true={hasRows}>
        <lightning-datatable key-field="Id" data={filteredProperties} columns={columns} hide-checkbox-column></lightning-datatable>
      </template>
      <template if:false={hasRows}><p class="slds-p-top_medium slds-text-color_weak">No property records found.</p></template>
      <template if:true={error}><p class="slds-text-color_error">{errorMessage}</p></template>
    </div>
  </lightning-card>
</template>
